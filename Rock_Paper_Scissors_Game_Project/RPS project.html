<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="RPS project.css">
</head>
<body>
    <div id="heading"><h1>Rock Paper Scissors Game</h1></div>
<div id="container">
    <div class="choice" id="rock">
        <img src="image/rockimage.jpg" alt="rock">
    </div>
    
    <div class="choice" id="paper">
        <img src="image/paperimage.jpg" alt="paper">
    </div>
    
    <div class="choice" id="scissors">
        <img src="image/scissorimage.jpg" alt="scissor">
    </div>
</div>
<div class="score-board">
    <div class="score">
        <div id="userscr">0</div>
        <div>You</div>
    </div>
    <div class="score">
        <div id="computerscr">0</div>
        <div>Computer</div>
    </div>
</div>

<div id="msg-container">
    <p id="msg">Play Your Move</p>
</div>

<script src="RPS project.js"></script>
</body>
</html>
